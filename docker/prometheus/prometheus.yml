global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/nanoflare-alerts.yml

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets:
          - traefik:8080
  - job_name: nanoflared
    bearer_token_file: /run/secrets/nanoflare-metrics-token
    static_configs:
      - targets:
          - nanoflared:8080
