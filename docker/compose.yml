services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nanoflare
      POSTGRES_USER: nanoflare
      POSTGRES_PASSWORD: nanoflare-development
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanoflare -d nanoflare"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nanoflare
      MINIO_ROOT_PASSWORD: nanoflare-development
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data

  nanoflared:
    image: ghcr.io/wen-templari/nanoflared:${NANOFLARE_IMAGE_TAG:-latest}
    command:
      - -addr=:8080
      - -runtime-addr=:8081
      - -config-dir=/var/lib/nanoflare/generated
      - -auth-url=http://nanoflared:8080/internal/auth/verify
      - -worker-host=nanoflare-runner
      - -prometheus-url=http://prometheus:9090

      - -loki-url=http://loki:3100
      - -runner-url=http://nanoflare-runner:8090
      - -litestream-enabled=${NANOFLARE_LITESTREAM_ENABLED:-false}
    environment:
      DATABASE_URL: postgres://nanoflare:nanoflare-development@postgres:5432/nanoflare?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: nanoflare
      MINIO_SECRET_KEY: nanoflare-development
      MINIO_BUCKET: ${MINIO_BUCKET:-nanoflare}
      MINIO_SECURE: "false"
      NANOFLARE_BASE_HOSTNAME: ${NANOFLARE_BASE_HOSTNAME:-workers.example.test}
      NANOFLARE_TRAEFIK_TOKEN: ${NANOFLARE_TRAEFIK_TOKEN:-nanoflare-development}
      NANOFLARE_RUNNER_TOKEN: ${NANOFLARE_RUNNER_TOKEN:-nanoflare-development}
      NANOFLARE_SECRET_KEY: ${NANOFLARE_SECRET_KEY:-}
      NANOFLARE_METRICS_TOKEN: ${NANOFLARE_METRICS_TOKEN:-}
      NANOFLARE_LOG_VECTOR_SOCKET: unix:///var/run/nanoflare/vector.sock
      # Dynamic outbound runs in this daemon; mount configured CA paths in both services.
      NANOFLARE_DNS_CONFIG: ${NANOFLARE_DNS_CONFIG:-}
      NANOFLARE_WFP_DNS: ${NANOFLARE_WFP_DNS:-true}
      NANOFLARE_WORKERD_EGRESS_PROXY_URL: ${NANOFLARE_WORKERD_EGRESS_PROXY_URL:-}
      NANOFLARE_WORKERD_EGRESS_CA_FILES: ${NANOFLARE_WORKERD_EGRESS_CA_FILES:-}
      NANOFLARE_WORKERD_EGRESS_PROXY_RESOLVES: ${NANOFLARE_WORKERD_EGRESS_PROXY_RESOLVES:-false}
      NANOFLARE_WORKERD_EGRESS_NO_PROXY: ${NANOFLARE_WORKERD_EGRESS_NO_PROXY:-}
      NANOFLARE_OIDC_ISSUER: ${NANOFLARE_OIDC_ISSUER:-}
      NANOFLARE_OIDC_AUDIENCE: ${NANOFLARE_OIDC_AUDIENCE:-}
      NANOFLARE_OIDC_CLIENT_ID: ${NANOFLARE_OIDC_CLIENT_ID:-}
      NANOFLARE_OIDC_CLIENT_SECRET: ${NANOFLARE_OIDC_CLIENT_SECRET:-}
      NANOFLARE_OIDC_PUBLIC_URL: ${NANOFLARE_OIDC_PUBLIC_URL:-}
      NANOFLARE_OIDC_COOKIE_DOMAIN: ${NANOFLARE_OIDC_COOKIE_DOMAIN:-}
      NANOFLARE_OIDC_EMAIL_CLAIM: ${NANOFLARE_OIDC_EMAIL_CLAIM:-email}
      NANOFLARE_OIDC_SCOPES: ${NANOFLARE_OIDC_SCOPES:-}
      NANOFLARE_OIDC_SESSION_IDLE: ${NANOFLARE_OIDC_SESSION_IDLE:-}
      NANOFLARE_OIDC_SESSION_ABSOLUTE: ${NANOFLARE_OIDC_SESSION_ABSOLUTE:-}
      NANOFLARE_CONTROL_OIDC_ISSUER: ${NANOFLARE_CONTROL_OIDC_ISSUER:-}
      NANOFLARE_CONTROL_OIDC_CLIENT_ID: ${NANOFLARE_CONTROL_OIDC_CLIENT_ID:-}
      NANOFLARE_CONTROL_OIDC_CLIENT_SECRET: ${NANOFLARE_CONTROL_OIDC_CLIENT_SECRET:-}
      NANOFLARE_CONTROL_OIDC_PUBLIC_URL: ${NANOFLARE_CONTROL_OIDC_PUBLIC_URL:-}
      NANOFLARE_CONTROL_OIDC_EMAIL_CLAIM: ${NANOFLARE_CONTROL_OIDC_EMAIL_CLAIM:-email}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: nanoflared
      NANOFLARE_OTEL_SAMPLE_RATIO: ${NANOFLARE_OTEL_SAMPLE_RATIO:-0.1}
    ports:
      - "8080:8080"
    volumes:
      - nanoflared-data:/var/lib/nanoflare/generated
      - nanoflare-vector-socket:/var/run/nanoflare:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      nanoflare-runner:
        condition: service_started
      alloy:
        condition: service_started

  nanoflare-runner:
    image: ghcr.io/wen-templari/nanoflare-runner:${NANOFLARE_IMAGE_TAG:-latest}
    command:
      - -addr=:8090
      - -config-dir=/var/lib/nanoflare/runner
      - -runtime-socket-dir=/tmp/nanoflare-sockets
      - -nanoflare-runtime-addr=nanoflared:8081
    environment:
      NANOFLARE_RUNNER_TOKEN: ${NANOFLARE_RUNNER_TOKEN:-nanoflare-development}
      NANOFLARE_LOG_VECTOR_SOCKET: unix:///var/run/nanoflare/vector.sock
      # Optional proxy URL; mount any configured CA paths through an override file.
      NANOFLARE_WORKERD_EGRESS_PROXY_URL: ${NANOFLARE_WORKERD_EGRESS_PROXY_URL:-}
      NANOFLARE_WORKERD_EGRESS_CA_FILES: ${NANOFLARE_WORKERD_EGRESS_CA_FILES:-}
      NANOFLARE_WORKERD_EGRESS_PROXY_RESOLVES: ${NANOFLARE_WORKERD_EGRESS_PROXY_RESOLVES:-false}
      NANOFLARE_WORKERD_EGRESS_NO_PROXY: ${NANOFLARE_WORKERD_EGRESS_NO_PROXY:-}
      NANOFLARE_DNS_CONFIG: ${NANOFLARE_DNS_CONFIG:-}
      NANOFLARE_DNS_ADDR: ${NANOFLARE_DNS_ADDR:-127.0.0.1:8083}
    volumes:
      - nanoflare-runner-data:/var/lib/nanoflare/runner
      - nanoflare-vector-socket:/var/run/nanoflare:ro

  traefik:
    image: traefik:v3.4
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --metrics.prometheus=true
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --providers.http.endpoint=http://nanoflared:8080/internal/traefik/config
      - --providers.http.pollInterval=1s
      - --providers.http.headers.Authorization=Bearer ${NANOFLARE_TRAEFIK_TOKEN:-nanoflare-development}
    ports:
      - "8088:80"
      - "8443:443"
      - "127.0.0.1:8089:8080"
    depends_on:
      nanoflared:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${NANOFLARE_METRICS_TOKEN_FILE:-./prometheus/metrics-token.example}:/run/secrets/nanoflare-metrics-token:ro
      - ./prometheus/nanoflare-alerts.yml:/etc/prometheus/nanoflare-alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - traefik

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.10.7
    command: -config.file=/etc/tempo/tempo.yml
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  alloy:
    image: grafana/alloy:v1.18.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - tempo

  vector:
    image: timberio/vector:0.46.1-alpine
    # Only trusted UID 0 / GID 65532 producers may traverse the collector dir.
    # Producers mount it read-only and cannot replace the collector socket.
    user: "0:65532"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mkdir -p /var/run/nanoflare &&
        chown 0:65532 /var/run/nanoflare &&
        chmod 0710 /var/run/nanoflare &&
        exec /usr/local/bin/vector --config /etc/vector/vector.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
      - nanoflare-vector-socket:/var/run/nanoflare
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - tempo

volumes:
  postgres-data:
  minio-data:
  nanoflared-data:
  nanoflare-runner-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  vector-data:
  grafana-data:
  nanoflare-vector-socket:
