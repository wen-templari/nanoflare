services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nanoflare
      POSTGRES_USER: nanoflare
      POSTGRES_PASSWORD: nanoflare-development
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanoflare -d nanoflare"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nanoflare
      MINIO_ROOT_PASSWORD: nanoflare-development
    ports:
      - "9000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data

  traefik:
    image: traefik:v3.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --metrics.prometheus=true
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --providers.http.endpoint=http://host.docker.internal:8080/internal/traefik/config
      - --providers.http.pollInterval=1s
      - --providers.http.headers.Authorization=Bearer ${NANOFLARE_TRAEFIK_TOKEN:-nanoflare-development}
    ports:
      - "8088:80"
      - "443:443"
      - "8089:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - traefik

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ../loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  vector:
    image: timberio/vector:0.46.1-alpine
    command: --config /etc/vector/vector.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
      - ../var/vector:/var/run/nanoflare
    ports:
      # Host-run nanoflared/nanoflare-runner should use:
      # NANOFLARE_LOG_VECTOR_SOCKET=tcp://127.0.0.1:6000
      - "127.0.0.1:6000:6000"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  loki-data:
  vector-data:
  grafana-data:
