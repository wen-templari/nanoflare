# Run local-source integration tests in an isolated Compose project:
# docker compose -p nanoflare-e2e -f docker/compose.yml -f docker/compose.e2e.yml up -d --build
services:
  nanoflared:
    image: nanoflare-e2e/nanoflared:local
    build:
      context: ..
      target: nanoflared
  nanoflare-runner:
    image: nanoflare-e2e/nanoflare-runner:local
    build:
      context: ..
      target: nanoflare-runner
