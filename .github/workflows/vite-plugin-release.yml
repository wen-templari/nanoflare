name: Publish Vite Plugin Release

on:
  push:
    tags:
      - "vite-plugin-v*"
  workflow_call:
    inputs:
      release_tag:
        description: Existing Vite-plugin release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: vite-plugin-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: |
          pnpm config set --json allowBuilds '{"workerd":true}' --location project
          pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          set -eu
          version="$(node -p "require('./packages/vite-plugin/package.json').version")"
          test "$RELEASE_TAG" = "vite-plugin-v$version"

      - name: Test package
        run: pnpm --filter @nanoflare/vite-plugin test

      - name: Verify package contents
        working-directory: packages/vite-plugin
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/vite-plugin
        run: npm publish --access public --provenance
