name: Publish Release

on:
  push:
    tags:
      - "v*"
      - "vite-plugin-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

jobs:
  core:
    if: startsWith(inputs.tag || github.ref_name, 'v') && !startsWith(inputs.tag || github.ref_name, 'vite-plugin-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: core-publish-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"

      - name: Build release archives
        run: |
          set -eu

          mkdir -p dist

          build_platform() {
            goos=$1
            goarch=$2
            commands=$3
            archive="nanoflare-${RELEASE_TAG}-${goos}-${goarch}.tar.gz"
            package_dir="dist/nanoflare-${goos}-${goarch}"

            rm -rf "$package_dir"
            mkdir -p "$package_dir"

            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi

            for command in $commands; do
              GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath -o "$package_dir/${command}${ext}" "./cmd/${command}"
            done

            tar -C dist -czf "dist/$archive" "nanoflare-${goos}-${goarch}"
            rm -rf "$package_dir"
          }

          build_platform darwin amd64 "nanoflare nanoflared nanoflare-runner"
          build_platform darwin arm64 "nanoflare nanoflared nanoflare-runner"
          build_platform linux amd64 "nanoflare nanoflared nanoflare-runner"
          build_platform linux arm64 "nanoflare nanoflared nanoflare-runner"
          build_platform windows amd64 "nanoflare"
          build_platform windows arm64 "nanoflare"

      - name: Prepare npm packages
        run: |
          set -eu
          ./scripts/build-npm-cli-binaries.sh
          node ./scripts/prepare-npm-cli-release.mjs "$RELEASE_TAG"

          mkdir -p dist/npm-tarballs
          for package in dist/npm/*; do
            (cd "$package" && npm pack --dry-run && npm pack --pack-destination ../../npm-tarballs)
          done

      - name: Create checksums
        run: shasum -a 256 dist/*.tar.gz dist/npm-tarballs/*.tgz > dist/checksums.txt

      - name: Test packed npm CLI
        run: |
          set -eu
          test_dir="$(mktemp -d)"
          npm init --yes --prefix "$test_dir" >/dev/null
          npm install --ignore-scripts --prefix "$test_dir" \
            dist/npm-tarballs/nanoflare-cli-[0-9]*.tgz \
            dist/npm-tarballs/nanoflare-cli-linux-x64-*.tgz \
            dist/npm-tarballs/create-nanoflare-[0-9]*.tgz
          "$test_dir/node_modules/.bin/nanoflare" --help
          (cd "$test_dir" && ./node_modules/.bin/create-nanoflare smoke-worker --template starter --no-interactive)
          test -f "$test_dir/smoke-worker/worker.ts"

      - name: Publish npm packages
        run: |
          set -eu
          for package in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            (cd "dist/npm/$package" && npx --yes npm@11.17.0 publish --access public --provenance)
          done
          (cd dist/npm/cli && npx --yes npm@11.17.0 publish --access public --provenance)
          (cd dist/npm/create-nanoflare && npx --yes npm@11.17.0 publish --access public --provenance)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-release-assets-${{ env.RELEASE_TAG }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/npm-tarballs/*.tgz

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --clobber

  vite-plugin:
    if: startsWith(inputs.tag || github.ref_name, 'vite-plugin-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: vite-plugin-publish-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: |
          pnpm config set --json allowBuilds '{"workerd":true}' --location project
          pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          set -eu
          version="$(node -p "require('./packages/vite-plugin/package.json').version")"
          test "$RELEASE_TAG" = "vite-plugin-v$version"

      - name: Test package
        run: pnpm --filter @nanoflare/vite-plugin test

      - name: Verify package contents
        working-directory: packages/vite-plugin
        run: npm pack --dry-run

      - name: Verify trusted publishing access
        working-directory: ${{ runner.temp }}
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          node -e 'const claims = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url")); console.log(JSON.stringify({ workflow: claims.workflow, workflow_ref: claims.workflow_ref, job_workflow_ref: claims.job_workflow_ref, event_name: claims.event_name, ref: claims.ref }))' "$oidc_token"
          pnpm --version

      - name: Publish to npm
        working-directory: packages/vite-plugin
        run: pnpm publish --access public --provenance --no-git-checks
