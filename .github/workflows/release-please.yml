name: Release Please

on:
  pull_request:
    paths:
      - .github/workflows/release-please.yml
      - scripts/release-please.mjs
      - scripts/release-please.test.mjs
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release-please.test.mjs

  release-please:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Release Please runtime
        env:
          RELEASE_PLEASE_RUNTIME: ${{ runner.temp }}/release-please
        run: npm install --prefix "$RELEASE_PLEASE_RUNTIME" --ignore-scripts --no-audit --no-fund --package-lock=false release-please@17.3.0

      - name: Run Release Please with GitHub query retries
        id: release
        env:
          # A GitHub App token (preferred) or bot PAT is required so that the
          # created tags, releases, and PRs trigger the downstream workflows.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PLEASE_RUNTIME: ${{ runner.temp }}/release-please
        run: node scripts/release-please.mjs

      - name: Update CLI version in created templates
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -eu
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --head release-please--branches--main --state open --json headRefName --jq '.[0].headRefName')"
          test -n "$branch"
          git fetch origin "$branch"
          git checkout --force -B "$branch" "origin/$branch"
          node scripts/update-create-template-cli.mjs
          node scripts/update-create-template-cli.mjs --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "release-please[bot]"
          git config user.email "551147+release-please[bot]@users.noreply.github.com"
          git add packages/create-nanoflare/templates
          git commit -m "chore: update create template CLI version"
          git push origin "HEAD:$branch"
