name: Recover Core Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing core release tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/go-release.yml
    with:
      release_tag: ${{ inputs.tag }}
