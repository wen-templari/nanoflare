name: WFP native sockets

on:
  pull_request:
    paths:
      - "internal/config/**"
      - "internal/runtimeassets/**"
      - "internal/api/**"
      - "internal/nanoflare/**"
      - "internal/cli/**"
      - "packages/cli/lib/runtime-profile.mjs"
      - "scripts/update-runtime-profile.mjs"
      - "cmd/nanoflared/**"
      - "cmd/nanoflare-runner/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/wfp-sockets.yml"
  push:
    branches: [main]
    paths:
      - "internal/config/**"
      - "internal/runtimeassets/**"
      - "internal/api/**"
      - "internal/nanoflare/**"
      - "internal/cli/**"
      - "packages/cli/lib/runtime-profile.mjs"
      - "scripts/update-runtime-profile.mjs"
      - "cmd/nanoflared/**"
      - "cmd/nanoflare-runner/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/wfp-sockets.yml"

permissions:
  contents: read

jobs:
  native-sockets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned workerd
        run: npm install --prefix "$RUNNER_TEMP/wfp-tools" workerd@1.20260911.1
      - name: Test native namespace sockets and affected packages
        run: |
          export NANOFLARE_TEST_WORKERD="$RUNNER_TEMP/wfp-tools/node_modules/.bin/workerd"
          "$NANOFLARE_TEST_WORKERD" --version
          go test -count=1 -v ./internal/config ./cmd/nanoflared ./cmd/nanoflare-runner
          go test -count=1 -v ./internal/api -run 'TestIssue78RuntimeRestrictionObservations|TestStableRuntimePrivateDynamicDispatch|TestWorkerdDynamicLoaderContracts|TestDispatchDNS|TestDispatchArtifactRejectsCollisionAndFinishesLease|TestWorkerdDynamicNamespacePrivateDNS'
          go test -count=1 ./internal/nanoflare ./internal/cli
          node internal/runtimeassets/testdata/dns-context.mjs
          node scripts/update-runtime-profile.mjs --check
          node --test packages/cli/test/*.cjs packages/cli/test/*.mjs
