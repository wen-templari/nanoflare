name: Publish Core Release

on:
  push:
    tags:
      - "v*"
      - "!vite-plugin-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Tag pushes do not populate either `github.event.release.tag_name` or
      # workflow-dispatch inputs. Use the ref name for that event so a tag
      # created by Release Please also publishes the npm packages.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build release archives
        run: |
          set -eu

          mkdir -p dist

          build_platform() {
            goos=$1
            goarch=$2
            commands=$3
            archive="nanoflare-${RELEASE_TAG:-dev}-${goos}-${goarch}.tar.gz"
            package_dir="dist/nanoflare-${goos}-${goarch}"

            rm -rf "$package_dir"
            mkdir -p "$package_dir"

            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi

            for command in $commands; do
              GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath -o "$package_dir/${command}${ext}" "./cmd/${command}"
            done

            tar -C dist -czf "dist/$archive" "nanoflare-${goos}-${goarch}"
            rm -rf "$package_dir"
          }

          build_platform darwin amd64 "nanoflare nanoflared nanoflare-runner"
          build_platform darwin arm64 "nanoflare nanoflared nanoflare-runner"
          build_platform linux amd64 "nanoflare nanoflared nanoflare-runner"
          build_platform linux arm64 "nanoflare nanoflared nanoflare-runner"
          build_platform windows amd64 "nanoflare"
          build_platform windows arm64 "nanoflare"

      - name: Prepare npm packages
        if: env.RELEASE_TAG != ''
        run: |
          set -eu
          ./scripts/build-npm-cli-binaries.sh
          node ./scripts/prepare-npm-cli-release.mjs "$RELEASE_TAG"

          mkdir -p dist/npm-tarballs
          for package in dist/npm/*; do
            (cd "$package" && npm pack --dry-run && npm pack --pack-destination ../../npm-tarballs)
          done

      - name: Create checksums
        run: |
          set -eu
          if [ -d dist/npm-tarballs ]; then
            shasum -a 256 dist/*.tar.gz dist/npm-tarballs/*.tgz > dist/checksums.txt
          else
            (cd dist && shasum -a 256 *.tar.gz > checksums.txt)
          fi

      - name: Test packed npm CLI
        if: env.RELEASE_TAG != ''
        run: |
          set -eu
          test_dir="$(mktemp -d)"
          npm init --yes --prefix "$test_dir" >/dev/null
          npm install --ignore-scripts --prefix "$test_dir" \
            dist/npm-tarballs/nanoflare-cli-[0-9]*.tgz \
            dist/npm-tarballs/nanoflare-cli-linux-x64-*.tgz
          "$test_dir/node_modules/.bin/nanoflare" --help

      - name: Publish npm packages
        if: env.RELEASE_TAG != ''
        run: |
          set -eu
          for package in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            (cd "dist/npm/$package" && npm publish --access public --provenance)
          done
          (cd dist/npm/cli && npm publish --access public --provenance)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-release-assets
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/npm-tarballs/*.tgz

      - name: Upload assets to GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --clobber
