packages:
  - apps/*
  - packages/*
  - packages/cli/npm/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# workerd's postinstall script selects the platform-specific binary required by
# the Cloudflare SDK. pnpm 11 requires build scripts to be explicitly approved.
allowBuilds:
  workerd: true
